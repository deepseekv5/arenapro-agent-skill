    <div class=&quot;section-head&quot;>

      <h2>这个 Skill 是什么</h2>
    </div>
    <div class=&quot;pos-grid&quot;>
      <div class=&quot;pos-statement&quot;>
        <p>一句话：把 ArenaPro 官方中文文档变成 AI Agent 可以按需检索、带出处引用的工作知识库。它不是文档的复制粘贴展示，而是一份带清单、索引与使用规程的 Skill——Agent 装载后知道「先查文档，再作答、再写码」。</p>
        <p class=&quot;pos-compo mono&quot;>构成 = SKILL.md（触发条件与检索规程）+ scripts/search.py（零依赖检索）+ references/docs/（85 篇官方文档转化件 + 自写导航索引 + 2 篇原创指南）· 详见 <a class=&quot;inline-link&quot; href=&quot;../docs-md/own/overview.md&quot;>Skill 总览</a></p>
      </div>
      <div class=&quot;pos-items&quot;>
        <article class=&quot;pos-item reveal&quot;>
          <h3>全量、结构化</h3>
          <p>对应官方站点导航层级组织：入门、开发工作流、进阶主题、组件框架、React UI、与引擎差异、配置权限、MCP、社区。保留原文标题层级、代码块与内部链接关系。</p>
        </article>
        <article class=&quot;pos-item reveal&quot;>
          <h3>按需检索，不塞满上下文</h3>
          <p>Skill 清单先给 Agent 一张主题地图，再按问题定位到具体 md 文件读取。问 HMR 就查 HMR，不必带着全部文档陪跑。</p>
        </article>
        <article class=&quot;pos-item reveal&quot;>
          <h3>答案可溯源</h3>
          <p>回答附带文档路径出处，写出的代码示例以官方 API 章节为准。出错时人和 Agent 都能回到原文核对。</p>
        </article>
      </div>
    </div>
  </section>

  <section class=&quot;section&quot; id=&quot;install&quot;>
    <div class=&quot;section-head&quot;>

      <h2>安装与使用</h2>
      <p class=&quot;sec-desc&quot;>Skill 是自包含目录 <code>skill/arenapro-docs/</code>（SKILL.md + scripts/search.py + references/docs/），拷贝即装。完整说明见 <a class=&quot;inline-link&quot; href=&quot;../docs-md/own/installation-and-usage.md&quot;>安装与使用指南</a>。</p>
    </div>
    <div class=&quot;start-grid&quot;>
      <div class=&quot;start-steps&quot;>
        <div class=&quot;start-step&quot;>
          <span class=&quot;start-idx mono&quot;>1</span>
          <div>
            <h3>拷贝进技能目录</h3>
            <p>项目级（仅当前项目）或用户级（该用户全部会话），任选其一：</p>
            <pre class=&quot;term mono&quot;><code># 项目级
$ mkdir -p &amp;lt;项目根&amp;gt;/.qoder/skills
$ cp -R arenapro-project/skill/arenapro-docs &amp;lt;项目根&amp;gt;/.qoder/skills/

# 用户级
$ cp -R arenapro-project/skill/arenapro-docs ~/.qoderwake/qodercli/skills/</code></pre>
            <p class=&quot;step-note&quot;>QoderWake 数字员工可在平台 Skill 管理入口挂载同一目录。</p>
          </div>
        </div>
        <div class=&quot;start-step&quot;>
          <span class=&quot;start-idx mono&quot;>2</span>
          <div>
            <h3>重载并确认装载</h3>
            <p>重启会话或执行 <code>/skills reload</code>，再用 <code>/skills list</code> 确认 <code>arenapro-docs</code> 已出现。</p>
            <pre class=&quot;term mono&quot;><code>$ python3 &amp;lt;skill_dir&amp;gt;/scripts/search.py --toc | head
# 应列出全部文档的相对路径与标题</code></pre>
          </div>
        </div>
        <div class=&quot;start-step&quot;>
          <span class=&quot;start-idx mono&quot;>3</span>
          <div>
            <h3>提问验证</h3>
            <p>ArenaPro 相关提问会自动触发，也可手动调用。先问一句要出处的，确认 Agent 在检索而非编造：</p>
            <pre class=&quot;term mono&quot;><code>/arenapro-docs 组件生命周期方法的执行顺序是什么？给出文档依据</code></pre>
            <p class=&quot;step-note&quot;>检索四模式：<code>search.py 关键词…</code>（AND 检索）、<code>--files</code>（命中排名）、<code>--toc</code>（全站目录）、<code>--read … --lines</code>（分页读取）。</p>
          </div>
        </div>
      </div>

        <p class=&quot;start-note&quot;>项目库 <code>docs-md/</code> 更新后无需重装。文档目录按优先级解析：<code>--docs-dir</code> 参数 &amp;gt; 环境变量 <code>ARENAPRO_DOCS_DIR</code> &amp;gt; Skill 内置 <code>references/docs/</code> &amp;gt; 相邻 <code>../../docs-md/</code>。例如：</p>

<script>
document.getElementById("f").addEventListener("load", function(){
  var fr=this;
  setTimeout(function(){
    var d=fr.contentDocument;
    if(!d){document.title="BLOCKED";return;}
    var de=d.documentElement, cw=de.clientWidth, out=[];
    d.querySelectorAll("*").forEach(function(el){
      var anc=el.parentElement, skip=false;
      while(anc){var s=fr.contentWindow.getComputedStyle(anc);if(["auto","scroll","hidden"].includes(s.overflowX)){skip=true;break;}anc=anc.parentElement;}
      if(skip)return;
      var r=el.getBoundingClientRect();
      if(r.right>cw+1&&r.width>0)out.push((el.tagName+"."+(typeof el.className==="string"?el.className.trim().split(/\s+/)[0]:""))+"@"+Math.round(r.right));
    });
    document.title="IF390|cw="+cw+"|sw="+de.scrollWidth+"|over="+out.length+"|"+out.slice(0,8).join("||");
  },2000);
});
</script></body></html>
